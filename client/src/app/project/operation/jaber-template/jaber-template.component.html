<div class="operationContainer">
    <div id="info">
        <div>
            <img class="info-img" [src]="gisObject.objectType.picBase64" />
        </div>
        <div>
            <img src="/images/icons/Bullets-red.png" class="blinking-icon" width="24" />
            <mtx-grid [data]="targetList" [columns]="columns" [loading]="false" [columnResizable]="true"
                [multiSelectable]="false" [rowSelectable]="true" [hideRowSelectionCheckbox]="true" [rowHover]="true"
                [rowStriped]="true" [showToolbar]="true" [toolbarTitle]="'اهداف قابل در اختیار گیری'"
                [columnHideable]="false" [columnSortable]="true" [columnPinnable]="true" [expandable]="true"
                [expansionTemplate]="expansionTpl" [pageOnFront]="true" [showPaginator]="false" [noResultText]="'هیچ موردی شناسایی نشده است.'"
                [pageSize]="5" />
            <ng-template #expansionTpl let-row>
                {{row.name}}
            </ng-template>
        </div>
    </div>
    <div class="operationMap">
        <div class="operator-row">
            <div class="operator-col">
                <mat-slide-toggle color="primary" [checked]="goToHome">
                    Jammer 2.4
                </mat-slide-toggle>
            </div>
            <div class="operator-col">
                <mat-slide-toggle color="primary" [checked]="goToLocation">
                    Jammer 5.8
                </mat-slide-toggle>
            </div>
        </div>
        <div class="operator-row">
            <div class="operator-col">
                <mat-slide-toggle color="primary" [checked]="flying">
                    Jammer 400
                </mat-slide-toggle>
            </div>
            <div class="operator-col">
                <mat-slide-toggle color="primary" [checked]="landing">
                    Jammer 900
                </mat-slide-toggle>
            </div>
        </div>
    </div>

</div>
