<div class="operationContainer">
    <div id="info">
        <div>
            <img class="info-img" [src]="gisObject.objectType.picBase64" />
        </div>
        <div>
            @if(!motor){
                <img src="/images/icons/Bullets-red.png" class="blinking-icon"  />
            }
            @else {
                <img src="/images/icons/Bullets-green.png" class="none-blinking-icon" />
            }
            <span>{{gisObject.name}}</span>
        </div>
    </div>

    <div class="main-content">
        <div class="row">
            <div class="operationMap">
                <div class="row">
                    <div class="col-lg-12">
                        <mat-slide-toggle color="primary" [checked]="motor" (change)="motorTogle()">
                            Motor
                        </mat-slide-toggle>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6">
                        <mat-slide-toggle color="primary" [checked]="jammer2_4" (change)="jammer2_4Togle()">
                            Jammer 2.4
                        </mat-slide-toggle>
                    </div>
                    <div class="col-lg-6">
                        <mat-slide-toggle color="primary" [checked]="jammer5_8" (change)="jammer5_8Togle()">
                            Jammer 5.8
                        </mat-slide-toggle>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6">
                        <mat-slide-toggle color="primary" [checked]="jammer400" (change)="jammer400Togle()">
                            Jammer 400
                        </mat-slide-toggle>
                    </div>
                    <div class="col-lg-6">
                        <mat-slide-toggle color="primary" [checked]="jammer900" (change)="jammer900Togle()">
                            Jammer 900
                        </mat-slide-toggle>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-6">
                        <mat-slide-toggle color="warm" [checked]="jammerGPS" (change)="jammerGPSTogle()">
                            Jammer GPS
                        </mat-slide-toggle>
                    </div>
                    <div class="col-lg-6">
                        <mat-slide-toggle color="accent" [checked]="jammerAll" (toggleChange)="allJammerTogle()">
                            All Jammer
                        </mat-slide-toggle>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="operationMap">
                <div class="operator-row">
                    <span>زاویه: {{target.theta}} °</span>
                    <span>فرکانس: {{target.centerFreq}} Hrz</span>

                </div>
            </div>
        </div>
    </div>
</div>
